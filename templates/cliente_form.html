{% extends 'base.html' %}
{% block title %}{{ 'Modifica' if cliente else 'Nuovo' }} Cliente{% endblock %}
{% block page_title %}{{ 'Modifica' if cliente else 'Nuovo' }} Cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">Dati Cliente</div>
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nome *</label>
              <input type="text" name="nome" class="form-control" value="{{ cliente.nome if cliente else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Cognome</label>
              <input type="text" name="cognome" class="form-control" value="{{ cliente.cognome if cliente else '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Azienda</label>
              <input type="text" name="azienda" class="form-control" value="{{ cliente.azienda if cliente else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ cliente.email if cliente else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Telefono</label>
              <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono if cliente else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">P.IVA</label>
              <input type="text" name="piva" class="form-control" value="{{ cliente.piva if cliente else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Codice Fiscale</label>
              <input type="text" name="cf" class="form-control" value="{{ cliente.cf if cliente else '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Indirizzo</label>
              <input type="text" name="indirizzo" class="form-control" value="{{ cliente.indirizzo if cliente else '' }}">
            </div>
            <div class="col-md-5">
              <label class="form-label">Città</label>
              <input type="text" name="citta" class="form-control" value="{{ cliente.citta if cliente else '' }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">CAP</label>
              <input type="text" name="cap" class="form-control" value="{{ cliente.cap if cliente else '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo</label>
              <select name="tipo" class="form-select">
                {% for t in ['Privato', 'Azienda', 'Prospect'] %}
                <option value="{{ t }}" {{ 'selected' if cliente and cliente.tipo == t else '' }}>{{ t }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Note</label>
              <textarea name="note" class="form-control" rows="3">{{ cliente.note if cliente else '' }}</textarea>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Salva</button>
            <a href="{{ url_for('clienti.index') }}" class="btn btn-outline-secondary">Annulla</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
